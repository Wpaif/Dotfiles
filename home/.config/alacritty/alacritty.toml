# =========================
# Alacritty - Full Dev Config
# =========================

[general]
import = ["theme.toml"]
# Atualiza automaticamente ao salvar o arquivo
live_config_reload = true

[window]
opacity = 0.92
# Sem barra de título; Ctrl+Shift+D alterna para novas janelas.
decorations = "none"
dynamic_padding = true
startup_mode = "Windowed"

[font]
# Nerd Font necessária para ícones Starship, Eza e Helix
normal.family = "JetBrainsMono Nerd Font Mono"
size = 13.0

[scrolling]
# Histórico generoso para Tmux + Helix
history = 10000
multiplier = 3

[selection]
semantic_escape_chars = " ()[]{}'\";:"

#[env]
# Term correto para Tmux
#TERM = "alacritty-truecolor"

# =========================
# Cursor
# =========================
[cursor]
style = "Beam"
unfocused_hollow = true

# Abre o seletor sem depender de uma sessão tmux ou do shell em foco.
[[keyboard.bindings]]
key = "T"
mods = "Control|Shift"
command = { program = "bash", args = ["-c", 'exec "$HOME/.local/bin/terminal-theme"'] }

# Ajusta somente a janela que acionou o atalho, mesmo dentro do tmux.
[[keyboard.bindings]]
key = "O"
mods = "Control|Shift"
command = { program = "bash", args = ["-c", 'exec "$HOME/.local/bin/terminal-opacity"'] }

[[keyboard.bindings]]
key = "D"
mods = "Control|Shift"
command = { program = "bash", args = ["-c", 'exec "$HOME/.local/bin/terminal-decorations" toggle'] }

[colors]
transparent_background_colors = true
