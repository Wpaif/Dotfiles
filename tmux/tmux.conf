# ============================================================
# ~/.tmux.conf
# ============================================================
# Requer tmux >= 3.3 (display-popup com -T / -d).
# Dependências: wl-clipboard (wl-copy), helix, lazygit, yazi.

# ------------------------------------------------------------
# PREFIXO: Ctrl-a
# ------------------------------------------------------------
unbind C-b
set -g prefix C-a

# Ctrl-a a e Ctrl-a Ctrl-a enviam Ctrl-a para o programa
bind a send-prefix
bind C-a send-prefix

# Ctrl-a r recarrega a configuração
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf recarregado"

# ------------------------------------------------------------
# GERAL
# ------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g mode-keys vi

# ------------------------------------------------------------
# TERMINAL: True Color, Extended Keys (CSI-u), Focus Events
# ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g extended-keys on
set -gq extended-keys-format csi-u
set -as terminal-features ",*:extkeys"

set -g focus-events on

# ------------------------------------------------------------
# CLIPBOARD (Wayland)
# ------------------------------------------------------------
set -g set-clipboard on

# ------------------------------------------------------------
# PANES
# ------------------------------------------------------------
# Navegação
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar (repetível sem soltar o prefixo)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits no diretório atual
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ------------------------------------------------------------
# WINDOWS
# ------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------
# FLOATING (todos abrem no diretório atual)
# ------------------------------------------------------------
# Terminal flutuante persistente (sessão "float" em segundo plano).
#   Ctrl-a f           mostra/esconde (o conteúdo é preservado)
#   Alt+setas          move o popup
#   Alt+Shift+setas    redimensiona o popup
# O script ~/.local/bin/tmux-float reabre o popup na nova posição/tamanho.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#9fef00"
set -g pane-border-style "fg=#313f55"
set -g pane-active-border-style "fg=#9fef00"

bind f run-shell "~/.local/bin/tmux-float toggle '#{client_name}' '#{session_name}' '#{pane_current_path}'"

%hidden FL="~/.local/bin/tmux-float"
bind -n M-Left    if -F "#{==:#{session_name},float}" "run-shell -b \"$FL move -4 0 '#{client_name}'\""  "send-keys M-Left"
bind -n M-Right   if -F "#{==:#{session_name},float}" "run-shell -b \"$FL move 4 0 '#{client_name}'\""   "send-keys M-Right"
bind -n M-Up      if -F "#{==:#{session_name},float}" "run-shell -b \"$FL move 0 -2 '#{client_name}'\""  "send-keys M-Up"
bind -n M-Down    if -F "#{==:#{session_name},float}" "run-shell -b \"$FL move 0 2 '#{client_name}'\""   "send-keys M-Down"
bind -n M-S-Left  if -F "#{==:#{session_name},float}" "run-shell -b \"$FL size -5 0 '#{client_name}'\""  "send-keys M-S-Left"
bind -n M-S-Right if -F "#{==:#{session_name},float}" "run-shell -b \"$FL size 5 0 '#{client_name}'\""   "send-keys M-S-Right"
bind -n M-S-Up    if -F "#{==:#{session_name},float}" "run-shell -b \"$FL size 0 -5 '#{client_name}'\""  "send-keys M-S-Up"
bind -n M-S-Down  if -F "#{==:#{session_name},float}" "run-shell -b \"$FL size 0 5 '#{client_name}'\""   "send-keys M-S-Down"

# Outros popups (modais, abrem no diretório atual)
bind e display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "helix"
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind y display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "yazi"

# ------------------------------------------------------------
# BARRA DE STATUS (segmentos em ~/.local/bin/tmux-status)
# Requer uma Nerd Font para os ícones.
# ------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a2332,fg=#a4b1cd"
set -g status-left-length 30
set -g status-right-length 120

# Sessão (fica laranja enquanto o prefixo Ctrl-a está ativo)
set -g status-left "#[fg=#141d2b,bg=#{?client_prefix,#ffaf00,#9fef00},bold] #S #[default] "

# Janelas
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#141d2b,bg=#9fef00,bold] #I:#W#{?window_zoomed_flag, 󰁌,} #[default]"
set -g window-status-style "fg=#6b7a99"
set -g window-status-bell-style "fg=#ff3e3e,bold"

# Direita: git | cpu | ram | rede | hora
set -g status-right "#[fg=#cf8dfb]#(~/.local/bin/tmux-status git '#{pane_current_path}') #[fg=#ffcc5c]#(~/.local/bin/tmux-status cpu) #[fg=#5cb2ff]#(~/.local/bin/tmux-status ram) #[fg=#2ee7b6]#(~/.local/bin/tmux-status net) #[fg=#141d2b,bg=#9fef00,bold] %H:%M #[default]"

set -g message-style "bg=#9fef00,fg=#141d2b"
set -g mode-style "bg=#9fef00,fg=#141d2b"

# ------------------------------------------------------------
# COPY MODE (vi)
# ------------------------------------------------------------
# Ctrl-a [ entra no copy mode (padrão do tmux)
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q      send -X cancel

# Mouse: selecionar com o botão esquerdo e copiar ao soltar
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ------------------------------------------------------------
# CHEATSHEET
# ------------------------------------------------------------
# Ctrl-a ?
#
# Abre uma colinha rolável (less: j/k, Ctrl-d/u, g/G, /busca, mouse, q sai).
# O texto fica em ~/.tmux-cheatsheet.txt
bind ? display-popup -E -w 70% -h 85% -T " tmux shortcuts " \
    'less -R --mouse -i ~/.tmux-cheatsheet.txt'
